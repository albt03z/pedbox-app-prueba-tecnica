server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real (ej.
    # /characters/algun-uuid) se resuelve con index.html para que
    # React Router la maneje del lado del cliente, en vez de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
